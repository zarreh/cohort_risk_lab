# Production stack. Publishes no host ports: a reverse proxy on the external
# `edge` network is the only way in. Service names are unique across apps
# because they become DNS aliases on the shared `edge` network.
services:
  cohort-api:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      - edge

  cohort-web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${WEB_PUBLIC_API_URL:-http://localhost/api}
    environment:
      API_INTERNAL_URL: http://cohort-api:8000
    depends_on:
      cohort-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - edge

networks:
  edge:
    external: true
