site_name: Cohort Risk & Review Lab
site_description: The model decides, the agent explains, the human approves — and the fairness number is per subgroup, not aggregate.
repo_url: https://github.com/zarreh/cohort_risk_lab
edit_uri: edit/main/docs/

exclude_docs: |
  PLAN.md
  generate_plots.py
  assets/plot_style.mplstyle

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - How it works:
      - In plain language: how-it-works/in-plain-language.md
  - Architecture:
      - Overview: architecture/overview.md
      - Decisions:
          - Index: architecture/decisions/index.md
          - D-A12-1 LLM is not the risk model: architecture/decisions/D-A12-1-llm-is-not-the-risk-model.md
          - D-A12-2 Injected access gap: architecture/decisions/D-A12-2-injected-access-gap.md
          - D-A12-3 Calibration over equalised odds: architecture/decisions/D-A12-3-calibration-over-equalised-odds.md
          - D-A12-4 Illness-burden proxy: architecture/decisions/D-A12-4-illness-burden-proxy.md
          - D-A12-5 Min-n and confidence intervals: architecture/decisions/D-A12-5-min-n-confidence-intervals.md
          - D-A12-6 Shared-code extraction debt: architecture/decisions/D-A12-6-shared-code-extraction-debt.md
          - D-A12-7 Typed tools not text-to-SQL: architecture/decisions/D-A12-7-typed-tools-not-text-to-sql.md
  - Evidence:
      - Data profile: evidence/data-profile.md
      - Subgroup fairness audit: evidence/fairness-audit.md
      - Label-choice experiment: evidence/label-choice-experiment.md
  - Regulatory basis: regulatory-basis.md
  - Run it yourself: run-it-yourself.md
  - API: api.md
